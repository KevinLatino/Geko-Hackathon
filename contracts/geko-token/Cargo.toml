[package]
name = "geko-token"
description = "Geko Token"
version = "0.0.0"
authors = ["Matias Aguilar <aaguilar1x@gmail.com>"]
license = "Apache-2.0"
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true, default-features = false }

[dev-dependencies]
soroban-sdk = { workspace = true, default-features = false, features = ["testutils"] }

[package.metadata.stellar]
contract = true
cargo_inherit = true